name: Run Tests

on:
  push:
    branches: [ test-env ]
  pull_request:
    branches: [ test-env ]

jobs:
  test:
    name: Test SyncFinity File Copy
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest test_syncfinity.py -v